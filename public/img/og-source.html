<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: Inter; src: url("../fonts/inter-latin.woff2") format("woff2"); font-weight: 100 900; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
      .photo { position: absolute; inset: 0; background: url("hero.webp") center/cover no-repeat; }
      .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(14,21,38,.96) 0%, rgba(14,21,38,.88) 55%, rgba(14,21,38,.35) 100%); }
      .hz { position: absolute; left: 0; right: 0; top: 0; height: 14px; background: repeating-linear-gradient(-45deg, #f7941e 0 14px, #0e1526 14px 28px); }
      .wrap { position: absolute; left: 72px; top: 96px; right: 72px; color: #fff; }
      .eye { font-size: 21px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #f7941e; }
      h1 { font-size: 68px; line-height: 1.02; letter-spacing: -.03em; margin: 22px 0 0; font-weight: 800; max-width: 900px; }
      h1 span { color: #f7941e; }
      p { font-size: 27px; color: rgba(255,255,255,.8); margin: 26px 0 0; max-width: 820px; }
      .brand { position: absolute; left: 72px; bottom: 56px; display: flex; align-items: center; gap: 16px; color: #fff; font-weight: 800; font-size: 32px; }
      .brand span { color: #f7941e; }
      .url { position: absolute; right: 72px; bottom: 64px; color: rgba(255,255,255,.75); font-size: 22px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="photo"></div>
    <div class="shade"></div>
    <div class="hz"></div>
    <div class="wrap">
      <div class="eye">Solar re-rack, repair &amp; service · Orlando to Miami</div>
      <h1>Solar panel removal, reinstall &amp; repair. <span>Any roof. Any installer.</span></h1>
      <p>Licensed and insured. Written quote before a panel moves.</p>
    </div>
    <div class="brand"><img src="../logo-art-of-solar.svg" width="60" height="60" alt="" />Art of&nbsp;<span>Solar</span></div>
    <div class="url">theartofsolar.com</div>
  </body>
</html>
