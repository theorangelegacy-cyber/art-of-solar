name: Secret scan

# Catches the one mistake that would be unrecoverable: committing a credential
# that bypasses row-level security.
#
# .env is tracked on purpose and holds only the Supabase *publishable* (anon)
# key and the project URL. Both are compiled into the browser bundle anyway, so
# they are not secrets. A service_role JWT is the opposite: it ignores every RLS
# policy on all 211 tables. If one ever lands in the tree it must be rotated,
# not just deleted, because the git history keeps it.
#
# This job is deliberately separate from ci.yml (which is workflow_dispatch-only
# after failing runs spammed the owner's inbox). It runs in seconds and stays
# green, so it should not add noise -- but if it ever goes red, that is worth
# an email.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Reject privileged credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tree
        run: |
          set -uo pipefail
          status=0

          # A Supabase JWT carries its role in the payload. Decode every JWT in
          # the tree; anything other than anon fails the build.
          while IFS= read -r token; do
            payload="$(printf '%s' "$token" | cut -d. -f2)"
            case $(( ${#payload} % 4 )) in
              2) payload="${payload}==" ;;
              3) payload="${payload}=" ;;
            esac
            decoded="$(printf '%s' "$payload" | tr '_-' '/+' | base64 -d 2>/dev/null || true)"
            case "$decoded" in
              *'"role":"service_role"'*)
                echo "::error::A Supabase service_role key is committed. It bypasses RLS on every table. Rotate it in the Supabase dashboard now -- deleting the file is not enough, the key stays in git history."
                status=1
                ;;
            esac
          done < <(grep -rhoE 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}' \
                     --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist . 2>/dev/null | sort -u)

          # Newer Supabase secret keys and common provider keys. The
          # SERVICE_ROLE_KEY pattern matches a quoted literal only -- reading it
          # from process.env is the correct pattern and must stay green.
          if grep -rqE "sb_secret_[A-Za-z0-9_-]{16,}|sk-[A-Za-z0-9]{32,}|SERVICE_ROLE_KEY[[:space:]]*[:=][[:space:]]*[\"'][A-Za-z0-9._-]{20,}[\"']" \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude=secret-scan.yml . 2>/dev/null; then
            echo "::error::A secret key is committed as a literal. Move it to the deployment environment and rotate it."
            status=1
          fi

          # Anything VITE_-prefixed is inlined into the browser bundle at build
          # time, so a secret under that name is published to every visitor.
          if grep -rqE 'VITE_[A-Z_]*(SERVICE_ROLE|SECRET|PRIVATE_KEY)' \
               --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude=secret-scan.yml . 2>/dev/null; then
            echo "::error::A VITE_ variable holds a secret. Anything VITE_-prefixed ships to the browser."
            status=1
          fi

          # Everything under public/ is served with no session check. Structured
          # data files there are how user records leak without anyone noticing.
          # Allowlist the files that are meant to be public.
          while IFS= read -r f; do
            case "${f#public/}" in
              manifest.json|robots.txt|llms.txt|.well-known/*|sitemap*.xml) ;;
              *)
                echo "::error::$f is served publicly with no session check. Confirm it holds no user data."
                status=1
                ;;
            esac
          done < <(find public -type f \( -name '*.json' -o -name '*.csv' -o -name '*.pdf' \) 2>/dev/null)

          if [ "$status" -eq 0 ]; then echo "Clean: no privileged credentials, no unexpected public data files."; fi
          exit "$status"
